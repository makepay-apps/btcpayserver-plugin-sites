name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - name: Use maintained npm
        run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = "11.21.2"
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
