name: Dependency security

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
      - name: Use maintained npm
        run: npm install --global npm@11.21.2 --ignore-scripts --no-audit --no-fund
      - name: Verify npm version
        run: test "$(npm --version)" = "11.21.2"
      - name: Audit every workspace
        shell: bash
        run: |
          set +e
          npm audit --package-lock-only --json --audit-level=info --registry=https://registry.npmjs.org > audit-all.json
          audit_all_status=$?
          npm audit --package-lock-only --omit=dev --json --audit-level=info --registry=https://registry.npmjs.org > audit-prod.json
          audit_prod_status=$?
          set -e
          node --input-type=module - "$audit_all_status" "$audit_prod_status" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          for (const workspace of ["apps/events", "apps/downloads", "packages/makepay-site-kit"]) {
            assert.ok(lock.packages[workspace], `Missing workspace: ${workspace}`);
          }
          for (const [index, name] of ["all", "prod"].entries()) {
            const report = JSON.parse(readFileSync(`audit-${name}.json`, "utf8"));
            assert.equal(report.error, undefined, `Audit request failed: ${name}`);
            assert.ok(report.metadata?.dependencies?.total > 0, `Missing audit coverage: ${name}`);
            assert.equal(report.metadata.vulnerabilities.total, 0, `Advisories found: ${name}`);
            assert.equal(process.argv[index + 2], "0", `Audit exited unsuccessfully: ${name}`);
          }
          NODE
      - name: Retain advisory results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-results
          path: audit-*.json
          if-no-files-found: error
          retention-days: 14
